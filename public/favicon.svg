<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vivid Kyndryl Coral-Red to Bright Solar Flame Gradient -->
    <linearGradient id="p-vivid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF7561" />
      <stop offset="45%" stopColor="#FF462D" />
      <stop offset="100%" stopColor="#E0301E" />
    </linearGradient>

    <linearGradient id="p-glow-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FF462D" />
      <stop offset="60%" stopColor="#F1C21B" />
      <stop offset="100%" stopColor="#FFFFFF" />
    </linearGradient>

    <!-- Drop Shadow for crisp high contrast on dark & light browser tabs -->
    <filter id="p-tab-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#BA2212" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- High-Visibility Vibrant Shield Base in Kyndryl Coral -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#p-vivid-grad)" filter="url(#p-tab-shadow)" />

  <!-- Bold, Crisp White & Amber Monogram 'P' (High Contrast & Legibility) -->
  <path
    d="M20 16V48M20 16H36C42.0751 16 47 20.9249 47 27C47 33.0751 42.0751 38 36 38H20"
    stroke="#FFFFFF"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Dynamic Kinetic Diagonal Slash in Solar Amber / White -->
  <path
    d="M29 38L44 48"
    stroke="url(#p-glow-accent)"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- Kinetic Central Spark Node -->
  <circle cx="36" cy="27" r="4" fill="#FFFFFF" />
  <circle cx="36" cy="27" r="2" fill="#FF462D" />
</svg>